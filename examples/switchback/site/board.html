<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchback · the day's board</title>
<meta name="description" content="Everyone's time to the summit of the day's valley.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M30 8c-6 5-18 1-20 7s16 4 16 11-12 6-18 6' stroke='%23e2672a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; background:
    linear-gradient(180deg, rgba(20,19,15,.82), rgba(20,19,15,.97) 420px, var(--bg) 700px),
    url(poster.jpg) center top / 100% auto no-repeat, var(--bg); }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 22px 60px; display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }
  .panel { background: rgba(29,28,23,.92); border: 1px solid var(--edge); border-radius: 14px; }
  .day { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; }
  .day h1 { margin: 0; font-weight: 500; font-size: clamp(26px, 3.4vw, 36px); }
  .day .when { color: var(--dim); }
  .day .arrows { margin-left: auto; display: flex; gap: 6px; }
  .day .arrows a, .day .arrows span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--edge); text-decoration: none; color: var(--paper); background: rgba(29,28,23,.8); }
  .day .arrows span { color: var(--faint); }
  .day .arrows a:hover { border-color: var(--orange); }

  .summary { padding: 22px 24px 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .stats .v { font-size: 26px; line-height: 1.15; }
  .graph { position: relative; height: 220px; display: flex; align-items: flex-end; gap: 3px; padding-top: 30px; border-bottom: 1px solid var(--edge); }
  .graph i { position: relative; flex: 1; background: rgba(236,226,200,.24); border-radius: 3px 3px 0 0; min-height: 2px; }
  .graph i:hover { background: rgba(236,226,200,.42); }
  .graph i.you { background: var(--orange); }
  .graph i.empty { background: rgba(236,226,200,.06); }
  .graph .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 12px; color: var(--paper); background: var(--panel2); border: 1px solid var(--edge); border-radius: 6px; padding: 2px 8px; display: none; pointer-events: none; z-index: 2; }
  .graph i:hover .tip { display: block; }
  .graph i.you .flag { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); color: var(--orange); font-size: 12px; white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .none { padding: 50px 0 40px; text-align: center; color: var(--dim); }

  .you-card { margin-top: 18px; padding: 16px 18px; border-radius: 10px; background: var(--orange-soft); border: 1px solid rgba(226,103,42,.35);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .you-card .place { font-size: 30px; line-height: 1; }
  .you-card .what { color: var(--dim); }
  .you-card .what b { color: var(--paper); font-weight: 500; }
  .you-card .btn { margin-left: auto; }
  .you-card.idle { background: rgba(236,226,200,.04); border-color: var(--edge); }

  .fastest { padding: 18px 20px; }
  .fastest h2 { margin: 0 0 8px; font-weight: 500; font-size: 17px; }
  .fastest ol { list-style: none; margin: 0; padding: 0; }
  .fastest li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--edge); }
  .fastest li .n { color: var(--dim); }
  .fastest li.you .who { color: var(--orange); }
  .fastest .hint { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .day { grid-column: 1; } .stats .v { font-size: 21px; } .graph { height: 170px; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><svg viewBox="0 0 40 40" fill="none"><path d="M30 8c-6 5-18 1-20 7s16 4 16 11-12 6-18 6" stroke="#e2672a" stroke-width="3.2" stroke-linecap="round"/><circle cx="31" cy="7" r="2.6" fill="#ece2c8"/></svg><span>SWITCHBACK</span></a>
  <span class="stamp" id="stamp"></span>
  <nav><a href="./">Drive</a><a href="board.html" aria-current="page">Board</a></nav>
  <span class="spacer"></span>
  <span class="countdown"></span>
  <div class="who"></div>
</header>
<main>
  <div class="day">
    <div><div class="caps" id="kicker">The day's board</div><h1 id="title">&nbsp;</h1></div>
    <span class="when" id="when"></span>
    <div class="arrows" id="arrows"></div>
  </div>
  <section class="panel summary" id="field"></section>
  <aside class="panel fastest" id="fastest"></aside>
</main>
<script type="module" src="board.js"></script>
</body>
</html>
